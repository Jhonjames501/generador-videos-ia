<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Videos IA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-950 text-white flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-2xl font-extrabold text-center mb-2 bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
            Generador IA de Videos
        </h1>
        <p class="text-gray-400 text-center mb-6 text-sm">Crea clips cinematográficos al instante.</p>
        
        <textarea id="prompt" placeholder="Ej: Un atardecer en Lima..." class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-white h-24 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
        
        <button onclick="generarVideo()" id="btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold py-3 rounded-lg hover:opacity-90 transition">
            Generar Video Gratis
        </button>

        <div id="resultado" class="mt-6 hidden">
            <h2 class="text-sm font-semibold text-gray-400 mb-2">Resultado:</h2>
            <video id="videoPlayer" controls class="w-full rounded-lg border border-gray-800"></video>
        </div>
    </div>

    <script>
        async function generarVideo() {
            const prompt = document.getElementById('prompt').value;
            const btn = document.getElementById('btn');
            const resultado = document.getElementById('resultado');
            const videoPlayer = document.getElementById('videoPlayer');

            if (!prompt.trim()) return alert('Escribe algo primero');

            btn.innerText = "Generando...";
            btn.disabled = true;

            try {
                // Aquí se conectará con tu backend en el futuro
                setTimeout(() => {
                    videoPlayer.src = "https://assets.mixkit.co/videos/preview/mixkit-tree-in-the-field-1197-large.mp4";
                    resultado.classList.remove('hidden');
                    btn.innerText = "Generar Video Gratis";
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                alert('Hubo un error');
                btn.innerText = "Generar Video Gratis";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
