<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador IA de Videos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                Generador IA de Videos
            </h1>
            <p class="text-slate-400 text-sm mt-1">Crea clips cinematográficos al instante.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Describe tu video:</label>
                <textarea id="promptInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 transition-all resize-none" placeholder="Ej: Un perro caminando y riéndose..."></textarea>
            </div>

            <button id="generateBtn" onclick="generarVideo()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-purple-900/30 flex items-center justify-center space-x-2">
                <span>Generar Video Gratis</span>
            </button>
        </div>

        <div class="mt-6">
            <p class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Resultado:</p>
            <div id="resultContainer" class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col items-center justify-center min-h-[180px] text-center">
                <p id="placeholderText" class="text-slate-500 text-xs">El video generado aparecerá aquí</p>
                <div id="videoCard" class="hidden w-full space-y-3">
                    <div class="relative rounded-lg overflow-hidden bg-slate-900 border border-slate-800">
                        <video id="videoElement" class="w-full rounded-lg" controls playsinline preload="metadata">
                            Tu navegador no soporta la reproducción de video.
                        </video>
                    </div>
                    <a id="downloadLink" href="#" target="_blank" class="block w-full bg-slate-800 hover:bg-slate-700 text-pink-400 text-xs font-medium py-2 rounded-lg transition-all text-center border border-slate-700">
                        Abrir / Descargar Video HD
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generarVideo() {
            const prompt = document.getElementById('promptInput').value.trim();
            const btn = document.getElementById('generateBtn');
            const placeholder = document.getElementById('placeholderText');
            const videoCard = document.getElementById('videoCard');
            const videoElement = document.getElementById('videoElement');
            const downloadLink = document.getElementById('downloadLink');

            if (!prompt) {
                alert("Por favor escribe una descripción para el video.");
                return;
            }

            // Cambiar estado a cargando
            btn.disabled = true;
            btn.innerHTML = "<span>Renderizando IA...</span>";
            placeholder.classList.remove('hidden');
            placeholder.innerText = "Procesando red neuronal y fotogramas...";
            videoCard.classList.add('hidden');

            try {
                // Simulación de espera de IA
                await new Promise(resolve => setTimeout(resolve, 3000)); 

                // Enlaces de video compatibles con móviles
                const videoUrls = [
                    "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                    "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
                    "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
                ];
                const selectedVideo = videoUrls[Math.floor(Math.random() * videoUrls.length)];

                placeholder.classList.add('hidden');
                videoElement.src = selectedVideo;
                downloadLink.href = selectedVideo;
                videoCard.classList.remove('hidden');
                
                videoElement.load();
            } catch (error) {
                placeholder.classList.remove('hidden');
                placeholder.innerText = "Error al generar el video. Intenta de nuevo.";
            } finally {
                btn.disabled = false;
                btn.innerHTML = "<span>Generar Video Gratis</span>";
            }
        }
    </script>
</body>
</html>
