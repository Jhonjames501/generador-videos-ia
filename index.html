<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador IA de Videos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                Generador IA de Videos
            </h1>
            <p class="text-slate-400 text-sm mt-1">Crea clips cinematográficos al instante.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Describe tu video:</label>
                <textarea id="promptInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 transition-all resize-none" placeholder="Ej: Perros jugando, un gato, paisaje..."></textarea>
            </div>

            <button id="generateBtn" onclick="generarVideo()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-purple-900/30 flex items-center justify-center space-x-2 cursor-pointer">
                <span>Generar Video Gratis</span>
            </button>
        </div>

        <div class="mt-6">
            <p class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Resultado:</p>
            <div id="resultContainer" class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col items-center justify-center min-h-[200px] text-center">
                <p id="placeholderText" class="text-slate-500 text-xs">El video generado aparecerá aquí</p>
                
                <!-- Contenedor del video corregido con source interno -->
                <div id="videoContainer" class="hidden w-full space-y-3">
                    <video id="videoOutput" class="w-full rounded-lg border border-slate-800 shadow-lg bg-black" controls autoplay playsinline muted>
                        <source id="videoSource" src="" type="video/mp4">
                        Tu navegador no soporta la reproducción de video.
                    </video>
                    <p class="text-xs text-pink-400 font-medium">✨ ¡Video generado con éxito!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generarVideo() {
            const promptField = document.getElementById('promptInput');
            const promptText = promptField.value.toLowerCase().trim();
            const btn = document.getElementById('generateBtn');
            const placeholder = document.getElementById('placeholderText');
            const videoContainer = document.getElementById('videoContainer');
            const videoOutput = document.getElementById('videoOutput');
            const videoSource = document.getElementById('videoSource');

            if (!promptText) {
                alert("Por favor escribe una descripción para el video.");
                return;
            }

            // Cambiar estado a cargando
            btn.disabled = true;
            btn.innerHTML = "<span>Renderizando IA...</span>";
            placeholder.classList.remove('hidden');
            placeholder.innerText = "Procesando red neuronal y fotogramas...";
            videoContainer.classList.add('hidden');

            try {
                // Simulación del proceso de IA
                await new Promise(resolve => setTimeout(resolve, 2000)); 

                // Usamos enlaces de videos públicos ultra-estables de respaldo directo
                let selectedVideo = "https://www.w3schools.com/html/mov_bbb.mp4"; // Video universal garantizado

                if (promptText.includes('perro') || promptText.includes('perros') || promptText.includes('caminando') || promptText.includes('jugando')) {
                    selectedVideo = "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";
                } else if (promptText.includes('gato') || promptText.includes('gatito')) {
                    selectedVideo = "https://www.w3schools.com/html/mov_bbb.mp4";
                }

                placeholder.classList.add('hidden');
                
                // Asignar y cargar de forma segura
                videoSource.src = selectedVideo;
                videoOutput.load();
                
                videoContainer.classList.remove('hidden');
                videoOutput.play().catch(e => console.log("Autoplay prevenido por navegador"));

            } catch (error) {
                placeholder.classList.remove('hidden');
                placeholder.innerText = "Error al generar el video. Intenta de nuevo.";
            } finally {
                btn.disabled = false;
                btn.innerHTML = "<span>Generar Video Gratis</span>";
            }
        }
    </script>
</body>
</html>
