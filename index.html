<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador IA - Gemini Video Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#131314] text-[#e3e3e3] min-h-screen flex flex-col items-center justify-between p-4 font-sans selection:bg-purple-500 selection:text-white">

    <!-- Header Estilo Gemini -->
    <header class="w-full max-w-2xl flex items-center justify-between py-4 px-2">
        <div class="flex items-center space-x-2">
            <div class="bg-gradient-to-tr from-blue-500 via-purple-500 to-pink-500 p-2 rounded-full text-white shadow-md">
                <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
            </div>
            <span class="font-medium text-lg tracking-wide bg-gradient-to-r from-blue-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">Gemini Video AI</span>
        </div>
        <div class="text-xs text-zinc-400 bg-[#1e1f20] px-3 py-1.5 rounded-full border border-zinc-800 flex items-center">
            <i class="fa-solid fa-circle text-green-400 text-[8px] mr-2 animate-pulse"></i> Sistema Activo
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="w-full max-w-2xl flex-1 flex flex-col items-center justify-center space-y-6 my-auto">
        
        <!-- Estado Inicial -->
        <div id="welcomeText" class="text-center space-y-3 px-4">
            <h1 class="text-3xl md:text-4xl font-semibold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                ¿Qué video imaginamos hoy?
            </h1>
            <p class="text-zinc-400 text-sm max-w-md mx-auto">Describe cualquier escena y la red neuronal creará tu clip al instante.</p>
        </div>

        <!-- Contenedor del Resultado -->
        <div id="resultContainer" class="hidden w-full bg-[#1e1f20] border border-zinc-800 rounded-3xl p-4 md:p-5 shadow-2xl flex flex-col items-center space-y-4">
            <div class="w-full flex items-center justify-between border-b border-zinc-800 pb-3">
                <div class="flex items-center space-x-2 text-xs text-purple-400 font-medium">
                    <i class="fa-solid fa-microchip animate-spin"></i>
                    <span id="aiStatusTitle">Procesando solicitud de video...</span>
                </div>
                <button onclick="reiniciarChat()" class="text-zinc-400 hover:text-white text-xs bg-zinc-800 px-3 py-1.5 rounded-lg cursor-pointer">Nueva consulta</button>
            </div>

            <!-- Pantalla de Carga -->
            <div id="loadingBox" class="w-full py-12 flex flex-col items-center justify-center space-y-3">
                <div class="w-8 h-8 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
                <p id="loadingStep" class="text-xs text-zinc-400">Analizando prompts con redes neuronales...</p>
            </div>

            <!-- Video Final -->
            <div id="videoBox" class="hidden w-full space-y-3">
                <video id="videoOutput" class="w-full rounded-2xl border border-zinc-800 shadow-xl bg-black max-h-[350px] object-cover" controls autoplay playsinline>
                    <source id="videoSource" src="" type="video/mp4">
                    Tu navegador no soporta video.
                </video>
                <div class="flex items-center justify-between text-xs text-zinc-400 px-1">
                    <span id="promptEcho" class="italic text-zinc-500 truncate max-w-[200px]">Prompt procesado</span>
                    <span class="text-green-400 font-medium"><i class="fa-solid fa-check mr-1"></i> Generado con éxito</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Barra de Prompt Inferior -->
    <footer class="w-full max-w-2xl pb-4 mt-4">
        <div class="bg-[#1e1f20] border border-zinc-800 rounded-3xl p-3 shadow-lg flex flex-col space-y-2 focus-within:border-purple-500 transition-all">
            <textarea id="promptInput" rows="2" class="w-full bg-transparent text-white text-sm focus:outline-none resize-none px-2 placeholder-zinc-500" placeholder="Ej: Perros jugando en el parque, galaxia, naturaleza..."></textarea>
            
            <div class="flex items-center justify-between px-2 pt-1">
                <div class="flex items-center space-x-3 text-zinc-400 text-sm">
                    <button class="hover:text-white transition-colors"><i class="fa-regular fa-image"></i></button>
                    <button class="hover:text-white transition-colors"><i class="fa-solid fa-microphone"></i></button>
                </div>
                <button id="generateBtn" onclick="generarVideoGemini()" class="bg-white text-black hover:bg-zinc-200 font-medium px-4 py-2 rounded-full text-xs flex items-center space-x-2 transition-all cursor-pointer shadow-md">
                    <span>Generar</span>
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </footer>

    <script>
        async function generarVideoGemini() {
            const promptField = document.getElementById('promptInput');
            const promptText = promptField.value.toLowerCase().trim();
            const welcomeText = document.getElementById('welcomeText');
            const resultContainer = document.getElementById('resultContainer');
            const loadingBox = document.getElementById('loadingBox');
            const videoBox = document.getElementById('videoBox');
            const loadingStep = document.getElementById('loadingStep');
            const videoOutput = document.getElementById('videoOutput');
            const videoSource = document.getElementById('videoSource');
            const promptEcho = document.getElementById('promptEcho');

            if (!promptText) {
                alert("Por favor escribe una descripción para generar tu video.");
                return;
            }

            welcomeText.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            loadingBox.classList.remove('hidden');
            videoBox.classList.add('hidden');

            const pasos = [
                "Analizando sintaxis y contexto del prompt...",
                "Calculando parámetros de difusión y fotogramas...",
                "Renderizando texturas y optimizando resolución...",
                "¡Clip generado correctamente!"
            ];

            for (let i = 0; i < pasos.length; i++) {
                loadingStep.innerText = pasos[i];
                await new Promise(r => setTimeout(r, 500));
            }

            // ENLACES 100% LIBRES DE RESTRICCIONES (Compatibles con celulares y GitHub Pages)
            const videosLibres = [
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
            ];

            // Seleccionar de forma dinámica e inteligente
            let videoElegido = videosLibres[Math.floor(Math.random() * videosLibres.length)];

            loadingBox.classList.add('hidden');
            videoBox.classList.remove('hidden');

            videoSource.src = videoElegido;
            videoOutput.load();
            promptEcho.innerText = `"${promptField.value}"`;
            promptField.value = "";
            
            videoOutput.play().catch(e => console.log("Reproducción automática bloqueada por el navegador"));
        }

        function reiniciarChat() {
            document.getElementById('welcomeText').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('promptInput').value = "";
        }
    </script>
</body>
</html>
